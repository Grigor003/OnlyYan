<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OnlyYan collections catalog: Armenia, France, Georgia and Italy drops by theme.">
    <title>Catalog | OnlyYan</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/catalog.css">
</head>
<body class="catalog-page">

    <header class="shared-header">
        <a href="index.html" class="back-link" aria-label="Back to home">← Home</a>
        <a href="index.html" class="logo-small">OnlyYan</a>
        <div class="header-spacer" aria-hidden="true"></div>
    </header>

    <main class="catalog-container">
        <section class="catalog-intro">
            <h1>Collection catalog</h1>
            <p>Choose a collection and theme</p>
        </section>

        <section class="catalog-grid">
            <article class="collection-card">
                <div class="collection-number">01</div>
                <h2 class="collection-title">Armenia</h2>
                <div class="theme-list" role="list" aria-label="Armenia themes">
                    <a href="hits.html?collection=armenia&theme=music" class="theme-link" role="listitem" aria-label="Open Armenia Music catalog">
                        <span>Armenia Music</span>
                        <span class="theme-id">01.1</span>
                    </a>
                    <a href="hits.html?collection=armenia&theme=movie" class="theme-link" role="listitem" aria-label="Open Armenia Movie catalog">
                        <span>Armenia Movie</span>
                        <span class="theme-id">01.2</span>
                    </a>
                </div>
            </article>

            <article class="collection-card">
                <div class="collection-number">02</div>
                <h2 class="collection-title">France</h2>
                <div class="theme-list" role="list" aria-label="France themes">
                    <a href="hits.html?collection=france&theme=music" class="theme-link" role="listitem" aria-label="Open France Music catalog">
                        <span>France Music</span>
                        <span class="theme-id">02.1</span>
                    </a>
                    <a href="hits.html?collection=france&theme=movie" class="theme-link" role="listitem" aria-label="Open France Movie catalog">
                        <span>France Movie</span>
                        <span class="theme-id">02.2</span>
                    </a>
                </div>
            </article>

            <article class="collection-card">
                <div class="collection-number">03</div>
                <h2 class="collection-title">Georgia</h2>
                <div class="theme-list" role="list" aria-label="Georgia themes">
                    <a href="hits.html?collection=georgia&theme=music" class="theme-link" role="listitem" aria-label="Open Georgia Music catalog">
                        <span>Georgia Music</span>
                        <span class="theme-id">03.1</span>
                    </a>
                    <a href="hits.html?collection=georgia&theme=movie" class="theme-link" role="listitem" aria-label="Open Georgia Movie catalog">
                        <span>Georgia Movie</span>
                        <span class="theme-id">03.2</span>
                    </a>
                </div>
            </article>

            <article class="collection-card">
                <div class="collection-number">04</div>
                <h2 class="collection-title">Italy</h2>
                <div class="theme-list" role="list" aria-label="Italy themes">
                    <a href="hits.html?collection=italy&theme=music" class="theme-link" role="listitem" aria-label="Open Italy Music catalog">
                        <span>Italy Music</span>
                        <span class="theme-id">04.1</span>
                    </a>
                    <a href="hits.html?collection=italy&theme=movie" class="theme-link" role="listitem" aria-label="Open Italy Movie catalog">
                        <span>Italy Movie</span>
                        <span class="theme-id">04.2</span>
                    </a>
                </div>
            </article>
        </section>
    </main>

</body>
</html>
